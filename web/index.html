<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<title>Scanner Carte · Prototipo</title>
<style>
:root{
  /* un solo tema scuro, come le app fotocamera: la carta inquadrata resta l'elemento più luminoso */
  --bg:#0d0f13; --panel:#171a21; --ink:#f1f3f7; --muted:#9aa1ae; --line:#2b303b;
  --accent:#ffd23f; --ok:#3ccf7d; --bad:#ff6b6b;
  --font:"Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#guide{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);height:min(68vh,128vw);aspect-ratio:63/88;border:3px solid var(--accent);border-radius:4.5%/3.2%;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center;background:linear-gradient(#000a,#0000)}
.stats{flex:1;font-size:.85rem;line-height:1.3;font-variant-numeric:tabular-nums}
.stats b{font-size:1rem}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(14px,env(safe-area-inset-bottom));display:grid;gap:10px;background:linear-gradient(#0000,#000c 40%)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:6px 12px;border-radius:999px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.row{display:flex;gap:10px;align-items:center;justify-content:center}
#shoot{width:76px;height:76px;border-radius:50%;background:var(--accent);border:5px solid #fff;color:#111;font-weight:800;font-size:.8rem}
#shoot:disabled{opacity:.4}
.side{min-width:84px;font-size:.85rem}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom));display:none}
.sheet.show{display:block}
.sheet h2{font-size:1.05rem;margin:0 0 4px}
.sheet p{margin:0 0 10px;color:var(--muted);font-size:.88rem}
.seen{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.seen canvas{width:64px;border-radius:4px;border:1px solid var(--line)}
.cands{display:grid;gap:8px}
.cand{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:8px}
.cand img{width:58px;aspect-ratio:63/88;object-fit:cover;border-radius:4px;background:#000;flex:none}
.cand .n{font-weight:700}
.cand .s{color:var(--muted);font-size:.82rem}
.cand .sc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.lang{display:inline-block;font-size:.7rem;font-weight:700;border:1px solid var(--muted);border-radius:4px;padding:0 4px;margin-right:4px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions button{flex:1}
#result .actions{position:sticky;bottom:calc(-1 * max(16px,env(safe-area-inset-bottom)));background:var(--panel);padding:8px 0 max(16px,env(safe-area-inset-bottom));margin-bottom:calc(-1 * max(16px,env(safe-area-inset-bottom)))}
#loading{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;background:var(--bg);padding:24px}
#loading h1{font-size:1.4rem;margin:0}
#loading p{color:var(--muted);margin:0;max-width:34ch}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#menu .actions{flex-direction:column}
#menu table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums;margin:6px 0 4px}
#menu td,#menu th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
#menu td:first-child,#menu th:first-child{text-align:left}
#copyText{width:100%;height:140px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;display:none;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.sheet.show{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<div id="guide" aria-hidden="true"></div>

<div class="top">
  <div class="stats" id="stats" role="status"><b>0</b> scansioni</div>
  <button id="torch" type="button" hidden>Torcia</button>
  <button id="openMenu" type="button" aria-label="Risultati e opzioni">Risultati</button>
</div>

<div class="bottom">
  <div class="chips" role="group" aria-label="Lingua delle carte che stai scansionando" id="langs">
    <button class="chip" type="button" data-lang="it" aria-pressed="true">Italiano</button>
    <button class="chip" type="button" data-lang="en" aria-pressed="false">Inglese</button>
    <button class="chip" type="button" data-lang="ja" aria-pressed="false">Giapponese</button>
    <button class="chip" type="button" data-lang="altro" aria-pressed="false">Altra</button>
  </div>
  <div class="row">
    <button class="side chip" type="button" id="sleeve" aria-pressed="false">In bustina</button>
    <button id="shoot" type="button" disabled>SCANSIONA</button>
    <label class="side chip" style="text-align:center">Da foto<input type="file" id="file" accept="image/*" hidden></label>
  </div>
</div>

<section class="sheet" id="result" aria-label="Risultato">
  <div class="seen"><canvas id="seen" width="320" height="446"></canvas>
    <div><h2>Qual è la tua carta?</h2><p>Tocca la <b>prima</b> con lo stesso disegno, anche se è in un'altra lingua.</p></div></div>
  <div class="cands" id="cands"></div>
  <div class="actions">
    <button type="button" id="none">Nessuna di queste</button>
    <button type="button" id="redo">Rifai, non contare</button>
  </div>
</section>

<section class="sheet" id="menu" aria-label="Risultati del test">
  <h2>Risultati del test</h2>
  <div id="table"></div>
  <p id="tech"></p>
  <div class="actions">
    <button type="button" id="copy">Copia risultati da incollare in chat</button>
    <textarea id="copyText" readonly aria-label="Risultati da copiare"></textarea>
    <button type="button" id="reset">Azzera i risultati</button>
    <button type="button" id="closeMenu">Chiudi</button>
  </div>
</section>

<div id="loading">
  <h1>Scanner Carte · Prototipo</h1>
  <p id="loadMsg">Preparo lo scanner…</p>
  <div class="bar"><i id="loadBar"></i></div>
  <p>La prima volta scarica circa 100 MB: meglio col Wi-Fi. Dopo resta salvato sul telefono.</p>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
